on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref of this repository to build.
        required: false
        type: string
        default: main
      tag:
        description: Release to build, such as v1.22.1 or nightly. Defaults to the latest release.
        required: false
        type: string
        default: ""
      version_postfix:
        description: Additional string to concatenate onto the existing version before release
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: The version the SDK was generated as.
        value: ${{ jobs.generate.outputs.version }}

name: CI

permissions:
  contents: read

env:
  VERSION_POSTFIX: ${{ inputs.version_postfix }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vrchatapi/vrchatapi-csharp
          ref: ${{ inputs.ref || github.ref }}

      - uses: vrchatapi/specification/.github/actions/setup-generator@main

      - uses: vrchatapi/specification/.github/actions/download@main
        with:
          bundle: openapi-3.1.json
          tag: ${{ inputs.tag }}

      # The SDK is a major and a minor version ahead of the specification.
      - id: version
        run: |
          version="$(yq -r '.info.version' openapi-3.1.json)"
          major="${version%%.*}"
          rest="${version#*.}"
          version="$(( major + 1 )).$(( ${rest%%.*} + 1 )).${rest#*.}${VERSION_POSTFIX}"

          echo "version=${version}" >> $GITHUB_OUTPUT

      - if: env.VERSION_POSTFIX != ''
        run: yq '--inplace' ".info.version |= \"${{ steps.version.outputs.version }}\"" openapi-3.1.json

      - run: bash ./generate.sh openapi-3.1.json "${{ steps.version.outputs.version }}"

      - run: cp README.md src/

      - uses: actions/upload-artifact@v7
        with:
          name: csharp-generated
          path: |
            .
            !.git/**
          include-hidden-files: true

  build:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: csharp-generated

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build VRChat.API.sln --configuration Release
